[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockbot"
version = "0.2.0"
description = "stockbotTOM v8 - JP equity pullback screener (data layer)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "requests>=2.31",
  "yfinance>=0.2.40",
  "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
fast = ["pyarrow>=15"]

[tool.setuptools.packages.find]
where = ["src"]
