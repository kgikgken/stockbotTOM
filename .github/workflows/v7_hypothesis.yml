name: v7-hypothesis

# 文献調査(2026-08)で事前登録した仮説 H1 / H2 / H4 の検証。
# v7.1のDCM(5次元)がIC≒0だったため、検証の方向を短期リバーサル側へ反転させる。
# 非重複期間・コスト感応度・BH補正付き。手動実行のみ。
# 日次のv7-screenやdimension_scores.csvの蓄積には一切影響しない。

on:
  workflow_dispatch:
    inputs:
      universe_cap:
        description: '銘柄数の上限。空欄なら全銘柄(初回は300程度で動作確認を推奨)'
        default: ''
      history_days:
        description: '取得する暦日数(既定1825=5年)'
        default: '1825'

permissions:
  contents: read

jobs:
  hypothesis:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run hypothesis test
        run: |
          set -o pipefail
          mkdir -p out_v7
          ARGS="--history-days ${{ github.event.inputs.history_days }}"
          if [ -n "${{ github.event.inputs.universe_cap }}" ]; then
            ARGS="$ARGS --universe-cap ${{ github.event.inputs.universe_cap }}"
          fi
          python hypothesis_test.py $ARGS | tee out_v7/hypothesis_log.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-report
          path: |
            out_v7/hypothesis_report.txt
            out_v7/hypothesis_panel.csv
            out_v7/hypothesis_log.txt
          if-no-files-found: warn
