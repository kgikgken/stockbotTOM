name: v7-grid

# 形成期間×保有期間グリッド検証(Jegadeesh-Titman型)。
# 文献調査(2026-08、グリッド較正)で確定した設計に基づく。
# 米国株での陽性対照(既知のモメンタムが検出できるかの確認)を含む。
# 手動実行のみ。日次のv7-screenやdimension_scores.csvの蓄積には影響しない。

on:
  workflow_dispatch:
    inputs:
      market:
        description: 'jp / us / both'
        default: 'both'
      universe_cap:
        description: '銘柄数の上限。空欄なら全銘柄(初回は300程度で動作確認を推奨)'
        default: ''
      history_days:
        description: '取得する暦日数(既定1825=5年)'
        default: '1825'

permissions:
  contents: read

jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Japanese font (Noto Sans CJK)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk

      - name: Run grid test
        run: |
          set -o pipefail
          mkdir -p out_v7
          ARGS="--market ${{ github.event.inputs.market }} --history-days ${{ github.event.inputs.history_days }}"
          if [ -n "${{ github.event.inputs.universe_cap }}" ]; then
            ARGS="$ARGS --universe-cap ${{ github.event.inputs.universe_cap }}"
          fi
          python grid_test.py $ARGS | tee out_v7/grid_log.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grid-report
          path: |
            out_v7/grid_report.txt
            out_v7/grid_heatmap.png
            out_v7/grid_log.txt
          if-no-files-found: warn
