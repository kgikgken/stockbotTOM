name: topdown-screen

# 2026-07-13完全移行: 実行対象を main_topdown.py(新スクリーニング: 地合い×セクター×カタリスト痕跡)に切替。
# 旧3システム(main_all.py / main.py / main_momentum.py)はコード温存・実行対象外(削除しない)。

on:
  schedule:
    # ★2026-07-27: 7:00 JSTに変更(旧7:30)。全銘柄取得の粘りループを追加したため
    # 実行時間が延びる。寄り付き(9:00)まで2時間の余裕を確保する。
    - cron: "0 22 * * 0-4"    # 7:00 JST 月〜金
  workflow_dispatch:
    inputs:
      dryrun:
        description: "SCREEN_DRYRUN (合成データで配信テスト)"
        default: "0"

permissions:
  contents: write   # 棄却台帳・positionsの永続化コミット用

concurrency:
  group: screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    # 45分→110分に延長。全銘柄を粘って取り切るための時間を確保する
    # (7:00開始+110分=8:50。9:00の寄り付きに間に合う)
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Japanese fonts (Noto Sans CJK JP)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run topdown screening
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
          ACCOUNT_EQUITY: ${{ vars.ACCOUNT_EQUITY }}
          SCREEN_DRYRUN: ${{ github.event.inputs.dryrun || '0' }}
          REQUIRE_LINE_DELIVERY: "0"
        run: python main_topdown.py

      - name: Persist ledgers (reject ledger, result template, positions, pending zone candidates)
        if: always()
        run: |
          git config user.name "stockbot"
          git config user.email "stockbot@users.noreply.github.com"
          for fpath in \
              out_topdown/topdown_plan_log.csv \
              out_topdown/topdown_track_log.csv \
              out_topdown/topdown_reject_ledger.csv \
              out_topdown/topdown_result_log_template.csv \
              positions_topdown.csv \
              pending_topdown.csv ; do
            [ -f "$fpath" ] && git add "$fpath" || echo "skip (not present): $fpath"
          done
          git diff --cached --quiet || git commit -m "topdown ledger: $(date -u +%F)"
          git push || echo "push skipped"

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: out_topdown/
          retention-days: 30
