name: validation-a-prime-design-window

# DESIGN.md §9.3・§10.2-4(a′): 保有期間 h の選択（(c)−(a′)が最大になるh）に使う
# (a′)母集団（G0〜G3通過だが押し目状態でない銘柄）を、設計窓（2021-08-01〜
# 2024-01-31）だけで計算する。store・data/replay（主評価窓）・
# data/replay_robustness（頑健性窓）のいずれにも書き込まない、完全に別の
# アーティファクト（data/a_prime）。
#
# 中断再開できる（既にその日のファイルがあればスキップする）。半年弱の単位で
# 区切ってトリガーする想定（頑健性窓の replay-robustness.yml と同じ運用）。
# ホールドアウト（2026-02〜2026-08）は既定で除外される（設計窓自体がそれより
# 前なので通常は関係ない）。

on:
  workflow_dispatch:
    inputs:
      start:
        description: "YYYY-MM-DD（2021-08-01以降）"
        required: true
      end:
        description: "YYYY-MM-DD（2024-01-31まで）"
        required: true

permissions:
  contents: read

# store キャッシュの読み取り中に書き込みが走らないよう data-daily と同じグループにする
concurrency:
  group: data-daily
  cancel-in-progress: false

jobs:
  a_prime:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Restore store (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data/store
          key: store-v2-${{ github.run_id }}
          restore-keys: |
            store-v2-

      # 主評価窓・頑健性窓のいずれとも別のキー空間・別ディレクトリ
      - name: Restore a_prime output (design window, separate artifact)
        uses: actions/cache@v4
        with:
          path: data/a_prime
          key: a-prime-v1-${{ github.run_id }}
          restore-keys: |
            a-prime-v1-

      - name: Tests
        run: python -m unittest discover -s tests -t .

      - name: (a′) replay (design window)
        run: |
          python scripts/run_a_prime_replay.py \
            --start "${{ github.event.inputs.start }}" \
            --end "${{ github.event.inputs.end }}"

      - name: (a′) summary
        if: always()
        run: |
          echo "saved day files: $(ls data/a_prime/*.csv.gz 2>/dev/null | wc -l)"
          python -c "
          from stockbot.validation.replay import load_a_prime_table
          t = load_a_prime_table('data/a_prime')
          print(f'rows={len(t)} days={t[\"date\"].nunique() if len(t) else 0}')
          "
