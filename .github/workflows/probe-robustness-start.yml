name: probe-robustness-start

# 診断専用（TASKS.md のタスクではない）。DESIGN.md §10.1「開始日の規則（R1.1 で追加）」に
# 従って頑健性窓の実際の開始日と、その日のユニバース通過銘柄数を実測する。store には
# 触れない（restore のみ）。用が済み次第このワークフローファイルごと削除する想定

on:
  workflow_dispatch:

permissions:
  contents: read

# store キャッシュの読み取り中に書き込みが走らないよう data-daily と同じグループにする
concurrency:
  group: data-daily
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Restore store (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data/store
          key: store-v2-${{ github.run_id }}
          restore-keys: |
            store-v2-

      - name: Compute robustness window start date
        run: python scripts/compute_robustness_start.py

      # 主評価窓・頑健性窓のいずれも変更しない、読み取りのみ
      - name: Restore main window replay (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data/replay
          key: replay-v2-${{ github.run_id }}
          restore-keys: |
            replay-v2-

      # 頑健性窓のreplay（チャンク実行中のものも含め、そのときcacheにある最新分）を
      # 読み取り専用で復元する。replay-robustness.yml と同じキー
      - name: Restore robustness window replay (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data/replay_robustness
          key: replay-robustness-v1-${{ github.run_id }}
          restore-keys: |
            replay-robustness-v1-

      # 2026-08-27 指示: ΔFの中間報告は停止（第2関門は全窓完成後の1回判定。
      # 部分集計を見ながら進めると続行/停止判断が検定として汚染される）。
      # チャンクごとの報告はヘルス指標（欠損率・ガード・行数・空日、
      # replay-robustness.yml の summary ステップで既に出している）のみに留める。
      # robustness_liquidity_diagnostics.py（ΔF計算を含む）はこのワークフローからは
      # 呼ばない。全窓完成後にT-403の最終集計として別途実行する

      # 決定的検証（2026-08-28指示）: 9900.Tの構造系特徴量を今日のstoreに対して
      # 再計算し、既存replayの170行と完全一致するかを確認する。一致すれば
      # 「効力発生が権利落ち日(2026-08-27)に一律適用された」ことになり両スケールは
      # 等価、除外解除の判断材料になる。不一致が残るなら別の問題が残っている
      - name: 9900.T全列再計算（決定的検証。storeが今日更新されていれば有効）
        if: always()
        run: python scripts/verify_full_recompute.py --replay-dir data/replay --focus-ticker 9900.T

      # check_splits を全銘柄・store の完全マージ済み系列に対して実行する
      # （revisions.csv.gzベースの走査は観測3日・2銘柄しかカバーしておらず
      # 「全履歴走査」として成立していなかったため、系列内の段差そのものを見る
      # 方式に切り替える）
      - name: check_splits を全銘柄・全期間で実行
        if: always()
        run: python scripts/check_splits_full_history.py
