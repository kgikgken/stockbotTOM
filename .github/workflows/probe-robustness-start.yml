name: probe-robustness-start

# 診断専用（TASKS.md のタスクではない）。DESIGN.md §10.1「開始日の規則（R1.1 で追加）」に
# 従って頑健性窓の実際の開始日と、その日のユニバース通過銘柄数を実測する。store には
# 触れない（restore のみ）。用が済み次第このワークフローファイルごと削除する想定

on:
  workflow_dispatch:

permissions:
  contents: read

# store キャッシュの読み取り中に書き込みが走らないよう data-daily と同じグループにする
concurrency:
  group: data-daily
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Restore store (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data/store
          key: store-v2-${{ github.run_id }}
          restore-keys: |
            store-v2-

      - name: Compute robustness window start date
        run: python scripts/compute_robustness_start.py

      # 主評価窓・頑健性窓のいずれも変更しない、読み取りのみ
      - name: Restore main window replay (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data/replay
          key: replay-v2-${{ github.run_id }}
          restore-keys: |
            replay-v2-

      # 頑健性窓のreplay（チャンク実行中のものも含め、そのときcacheにある最新分）を
      # 読み取り専用で復元する。replay-robustness.yml と同じキー
      - name: Restore robustness window replay (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data/replay_robustness
          key: replay-robustness-v1-${{ github.run_id }}
          restore-keys: |
            replay-robustness-v1-

      # 2026-08-27 指示: ΔFの中間報告は停止（第2関門は全窓完成後の1回判定。
      # 部分集計を見ながら進めると続行/停止判断が検定として汚染される）。
      # チャンクごとの報告はヘルス指標（欠損率・ガード・行数・空日、
      # replay-robustness.yml の summary ステップで既に出している）のみに留める。
      # robustness_liquidity_diagnostics.py（ΔF計算を含む）はこのワークフローからは
      # 呼ばない。全窓完成後にT-403の最終集計として別途実行する

      # 継続監視用（毎回re-runする必要は無いが低コストなので残す）
      - name: 9900.T全列再計算（継続監視用）
        if: always()
        run: python scripts/verify_full_recompute.py --replay-dir data/replay --focus-ticker 9900.T

      - name: check_splits を全銘柄・全期間で実行（継続監視用）
        if: always()
        run: python scripts/check_splits_full_history.py

      # 2026-08-29指示への回答済み: 289銘柄・2016-02-03〜2021-07-31の段差スキャン結果は
      # 分類1(頑健性窓内)=0 / 分類2(先頭数行のみ、9900.Tのみ該当)=1 / 分類3(段差なし)=288。
      # G3(252本)窓の実測: 2016-02-08は2017-02-17に窓から外れる(頑健性窓開始日2017-02-13
      # より後)。仮説とは逆に、先頭数行は頑健性窓最初の数営業日のused-lookbackに届いて
      # いた。ただし分類2の該当銘柄(9900.T)は既存の10銘柄機械的除外規則で両窓・
      # ホールドアウトから既に除外されているため、追加対応は不要（TASKS.md記録済み）。
      # storeはもう変わらないため再実行不要、このステップは削除する

      # 2026-08-29指示（分類3対照チェック）: 段差なし288銘柄について一様性を全列再計算
      # で確認する。verify_full_recompute.py は focus-ticker 以外の全銘柄から1行ずつ
      # サンプリングする仕様のため、頑健性窓replayに対して実行すれば288銘柄を横断的に
      # カバーできる（個別に数銘柄を選ぶより広い対照になる）
      - name: 頑健性窓replayでの全列再計算（分類3対照チェック、focus以外は1行/銘柄）
        if: always()
        run: python scripts/verify_full_recompute.py --replay-dir data/replay_robustness --focus-ticker 9900.T

      # 2026-08-29指示: 年別の1日あたり行数を両窓で報告（記録用、採否判断はしない）
      - name: 年別1日あたり行数（両窓）
        if: always()
        run: |
          echo "=== 主評価窓 ==="
          python scripts/replay_run_summary.py --replay-dir data/replay
          echo "=== 頑健性窓 ==="
          python scripts/replay_run_summary.py --replay-dir data/replay_robustness
