name: probe-robustness-start

# 診断専用（TASKS.md のタスクではない）。DESIGN.md §10.1「開始日の規則（R1.1 で追加）」に
# 従って頑健性窓の実際の開始日と、その日のユニバース通過銘柄数を実測する。store には
# 触れない（restore のみ）。用が済み次第このワークフローファイルごと削除する想定

on:
  workflow_dispatch:

permissions:
  contents: read

# store キャッシュの読み取り中に書き込みが走らないよう data-daily と同じグループにする
concurrency:
  group: data-daily
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Restore store (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data/store
          key: store-v2-${{ github.run_id }}
          restore-keys: |
            store-v2-

      - name: Compute robustness window start date
        run: python scripts/compute_robustness_start.py

      # 主評価窓・頑健性窓のいずれも変更しない、読み取りのみ
      - name: Restore main window replay (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data/replay
          key: replay-v2-${{ github.run_id }}
          restore-keys: |
            replay-v2-

      # 2026-08-26 実行条件の指示: 「指数の欠落が窓内0件だからno-op」は推論であり
      # 証明ではない。d2_rs120等のルックバックが窓の外まで遡るケースを見落とすため、
      # 実際に store から再計算して既存replayと完全一致するかを確認する
      - name: Verify main window D2 recompute is a no-op after PR #36
        continue-on-error: true
        run: python scripts/verify_d2_recompute.py --replay-dir data/replay

      # 指数の欠落として検出された日が、実際の取引日か東証休場日(カレンダー由来の
      # 誤検出)かを確認する
      - name: Check whether index gap dates are real trading days or exchange holidays
        if: always()
        run: python scripts/check_index_gap_dates.py

      # 2026-08-27 追加: no-op検証で唯一不一致が出た9900.Tの原因調査
      # (d2_rs60/rs120/rsline_posの差がほぼ一律ln(2)に近く、2025-02-20〜03-13に集中。
      # 分割調整のrevisionを疑う。ffillとは無関係の可能性が高い)
      - name: Inspect 9900.T around the mismatch dates (D2 no-op investigation)
        if: always()
        run: python scripts/inspect_ticker_revision.py --ticker 9900.T --around-date 2025-02-20 --window-days 40

      # 2026-08-27 実行条件の指示: no-op検証をD2の3列から全列に拡大。
      # 9900.Tは全行、他銘柄は1行サンプリング（全件だと約3.5時間かかるため）
      - name: Verify full structural recompute (D1-D8, gates, structure) is a no-op
        if: always()
        continue-on-error: true
        run: python scripts/verify_full_recompute.py --replay-dir data/replay --focus-ticker 9900.T

      # 2026-08-27 実行条件の指示: 分割予定公表・効力発生前の銘柄を全store点検
      - name: Scan store for other pending-split-adjustment tickers
        if: always()
        run: python scripts/scan_pending_split_adjustments.py --recent-days 3
