name: probe-robustness-start

# 診断専用（TASKS.md のタスクではない）。DESIGN.md §10.1「開始日の規則（R1.1 で追加）」に
# 従って頑健性窓の実際の開始日と、その日のユニバース通過銘柄数を実測する。store には
# 触れない（restore のみ）。用が済み次第このワークフローファイルごと削除する想定

on:
  workflow_dispatch:

permissions:
  contents: read

# store キャッシュの読み取り中に書き込みが走らないよう data-daily と同じグループにする
concurrency:
  group: data-daily
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Restore store (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data/store
          key: store-v2-${{ github.run_id }}
          restore-keys: |
            store-v2-

      - name: Compute robustness window start date
        run: python scripts/compute_robustness_start.py

      # 主評価窓・頑健性窓のいずれも変更しない、読み取りのみ
      - name: Restore main window replay (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data/replay
          key: replay-v2-${{ github.run_id }}
          restore-keys: |
            replay-v2-

      # 頑健性窓のreplay（チャンク実行中のものも含め、そのときcacheにある最新分）を
      # 読み取り専用で復元する。replay-robustness.yml と同じキー
      - name: Restore robustness window replay (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data/replay_robustness
          key: replay-robustness-v1-${{ github.run_id }}
          restore-keys: |
            replay-robustness-v1-

      # 2026-08-27 チャンク4結果への追加指示: 窓別ADV分布・ADV>=2億円部分集合の
      # ΔF診断・押し目状態行数<30日の除外・9900.Tのデータ品質除外を反映した集計
      - name: Robustness/main window liquidity diagnostics and ΔF (data-quality exclusion applied)
        if: always()
        run: |
          python scripts/robustness_liquidity_diagnostics.py \
            --main-replay-dir data/replay \
            --robustness-replay-dir data/replay_robustness \
            --h 10 --min-rows-per-day 30 --adv-threshold 200000000

      # 「前回の5項目」の未報告分への対応（2026-08-27）
      # (1) revisions.csv.gz が実際にどの期間をカバーしているか（全履歴走査の限界を確認）
      - name: revisions.csv.gz coverage (all tickers)
        if: always()
        run: python scripts/revisions_coverage.py

      # (2) 9900.Tの単発フル履歴再取得。storeのマージ結果ではなく、いま単発で
      # 取得した場合にも同じ場所に段差が出るかを切り分ける（ネットワークが要るため
      # 実インターネット環境=GitHub Actions上でのみ実行可能）
      - name: 9900.T single-shot full-history refetch probe (store 変更なし)
        if: always()
        run: python scripts/probe_9900_full_refetch.py
