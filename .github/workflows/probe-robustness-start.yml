name: probe-robustness-start

# 診断専用（TASKS.md のタスクではない）。DESIGN.md §10.1「開始日の規則（R1.1 で追加）」に
# 従って頑健性窓の実際の開始日と、その日のユニバース通過銘柄数を実測する。store には
# 触れない（restore のみ）。用が済み次第このワークフローファイルごと削除する想定

on:
  workflow_dispatch:

permissions:
  contents: read

# store キャッシュの読み取り中に書き込みが走らないよう data-daily と同じグループにする
concurrency:
  group: data-daily
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Restore store (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data/store
          key: store-v2-${{ github.run_id }}
          restore-keys: |
            store-v2-

      - name: Compute robustness window start date
        run: python scripts/compute_robustness_start.py

      # 主評価窓・頑健性窓のいずれも変更しない、読み取りのみ
      - name: Restore main window replay (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data/replay
          key: replay-v2-${{ github.run_id }}
          restore-keys: |
            replay-v2-

      # 2026-08-27 追加: no-op検証で不一致が出た9900.Tの境界確認。不一致が
      # 2025-02-20〜03-21（60/120日参照）と2025-08-25〜09-18（200日SMA・G3の
      # 252日参照）の2帯に分かれているのは、いずれも先出し適用の境界（2025-01-08
      # 前後とみられる）をルックバック窓がまたぐタイミングと一致する。一律スケール
      # なら比率系特徴量は不変で構造系に不一致は出ないはずなので、構造系が壊れて
      # いる事実自体が「一律ではない（段差がある）」ことの証拠。実データで確認する
      - name: Inspect 9900.T around the suspected 2025-01-08 boundary
        if: always()
        run: python scripts/inspect_ticker_revision.py --ticker 9900.T --around-date 2025-01-08 --window-days 45

      # 2026-08-27 追加: JPXの分割公表済み・効力発生前リスト（toushi-radar.com調べ）
      # のうち9900.T以外の直近効力発生（8/31〜9/1）4銘柄を含め、revisions.csv.gz
      # の全履歴（直近3日に限らない）を対象にきれいな比率の改訂が無いか再点検する
      - name: Full-history scan for pending-split-adjustment tickers (not limited to recent revisions)
        if: always()
        run: python scripts/scan_pending_split_adjustments.py --recent-days 36500
