name: backtest

# 手動実行のみ。実データ取得が重いため定期実行はしない。
# Actionsの「Run workflow」から期間・流動性下限を指定して回す。
# 目的は総合成績ではなく、設計上の争点3つ(ゾーンvs即時 / 半分利確 / 流動性フィルター)の比較。

on:
  workflow_dispatch:
    inputs:
      start:
        description: '検証開始日 (YYYY-MM-DD)'
        required: true
        default: '2023-01-01'
      end:
        description: '検証終了日 (YYYY-MM-DD)'
        required: true
        default: '2025-12-31'
      min_adv:
        description: '売買代金の下限(円)。本番5億=500000000 / Q1検証は1億=100000000'
        required: true
        default: '100000000'
      limit:
        description: '銘柄数の上限(0=全件)。まず300で試すのを推奨'
        required: true
        default: '300'
      step:
        description: '何営業日ごとに判定するか(5=週1相当)。小さいほど重い'
        required: true
        default: '5'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backtest
        env:
          SCREEN_DRYRUN: '0'
        run: |
          mkdir -p out_topdown
          python backtest_topdown.py \
            --start "${{ github.event.inputs.start }}" \
            --end "${{ github.event.inputs.end }}" \
            --min-adv "${{ github.event.inputs.min_adv }}" \
            --limit "${{ github.event.inputs.limit }}" \
            --step "${{ github.event.inputs.step }}" \
            --out out_topdown/backtest_result.csv \
            2>&1 | tee out_topdown/backtest_report.txt

      - name: Persist result
        if: always()
        run: |
          git config user.name "stockbot"
          git config user.email "stockbot@users.noreply.github.com"
          for fpath in out_topdown/backtest_result.csv out_topdown/backtest_report.txt ; do
            [ -f "$fpath" ] && git add "$fpath" || echo "skip (not present): $fpath"
          done
          git diff --cached --quiet || git commit -m "backtest: $(date -u +%F)"
          git push || echo "push skipped"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: |
            out_topdown/backtest_result.csv
            out_topdown/backtest_report.txt
          if-no-files-found: warn
