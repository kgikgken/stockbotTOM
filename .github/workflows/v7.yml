name: v7-screen

# stockbotTOM v7.1 — 次元抽出型スクリーニング(Dimension Coverage Model)。
# v6は廃止済み。本ワークフローが唯一のスクリーニング。

on:
  schedule:
    - cron: "0 22 * * 0-4"    # 7:00 JST 月〜金
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v7:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Japanese font (Noto Sans CJK)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk

      - name: Run v7
        env:
          SCREEN_DRYRUN: '0'
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: python main_v7.py

      - name: Persist dimension scores
        if: always()
        run: |
          git config user.name "stockbot"
          git config user.email "stockbot@users.noreply.github.com"
          for f in out_v7/dimension_scores.csv ; do
            [ -f "$f" ] && git add "$f" || echo "skip (not present): $f"
          done
          git diff --cached --quiet || git commit -m "v7: $(date -u +%F)"
          git push || echo "push skipped"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-report
          path: out_v7/
          if-no-files-found: warn
