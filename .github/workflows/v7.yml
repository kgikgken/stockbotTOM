name: v7-screen

# stockbotTOM v7.1 — 次元抽出型スクリーニング(Dimension Coverage Model)。
# v6は廃止済み。本ワークフローが唯一のスクリーニング。

on:
  schedule:
    - cron: "0 22 * * 0-4"    # 7:00 JST 月〜金
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v7:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - name: One-time fix - rename v7 directory
        run: |
          set -e
          if [ -d "v7 " ]; then
            git config user.name "stockbot"
            git config user.email "stockbot@users.noreply.github.com"
            git mv "v7 " v7
            git commit -m "fix: remove trailing space from v7 directory name"
            git push
            echo "'v7 ' -> 'v7' にリネームしてpush完了。このまま後続ステップに進みます。"
          else
            echo "'v7 '(末尾スペース付き)は存在しません。スキップします。"
          fi

      - name: Debug - check files
        run: |
          set +e
          echo "=== ルート直下 ==="
          ls -la
          echo "=== ルート直下のファイル名バイト確認 ==="
          python3 -c "import os; [print(repr(n), [hex(ord(c)) for c in n]) for n in os.listdir('.')]"
          echo "=== v7フォルダの中身 ==="
          ls -la v7/ 2>&1
          echo "=== main_v7.pyの有無 ==="
          ls -la main_v7.py 2>&1
          echo "=== 現在の作業ディレクトリ ==="
          pwd
          echo "=== Pythonが認識するsys.path ==="
          python3 -c "import sys; print('\n'.join(sys.path))" 2>&1 || echo "python3コマンド無し(次のsetup-pythonで入る)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Japanese font (Noto Sans CJK)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk

      - name: Run v7
        env:
          SCREEN_DRYRUN: '0'
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: python main_v7.py

      - name: Persist dimension scores
        if: always()
        run: |
          git config user.name "stockbot"
          git config user.email "stockbot@users.noreply.github.com"
          for f in out_v7/dimension_scores.csv ; do
            [ -f "$f" ] && git add "$f" || echo "skip (not present): $f"
          done
          # 日付別の履歴。手順5(局面別・60営業日以上)と将来の前向き検証に要る。
          if [ -d out_v7/history ]; then
            git add out_v7/history
          else
            echo "skip (not present): out_v7/history"
          fi
          git diff --cached --quiet || git commit -m "v7: $(date -u +%F)"
          # 元は `git push || echo "push skipped"` で失敗を全て握り潰していた。
          # これだとRun v7が落ちてCSVが更新されなくても本ステップは常に緑になり、
          # 「更新されない」原因を特定できなかった。手動再実行が重なった時の
          # 競合だけは1回リトライで拾い、それでも失敗すれば赤にする。
          if ! git push; then
            git pull --rebase && git push
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-report
          path: out_v7/
          if-no-files-found: warn
