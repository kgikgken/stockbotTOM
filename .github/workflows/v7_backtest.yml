name: v7-backtest

# stockbotTOM v7.1 バックテスト。DCS/カバレッジと将来リターンの関係を
# 複数の過去時点を横断して測る(仕様書Level 2〜4相当)。手動実行のみ。
# 重い処理(数年分のOHLCV取得+約40時点の再採点)のため、日次のv7-screenとは
# 独立したワークフローにしている。dimension_scores.csvの蓄積(v7.yml側)には
# 影響しない。

on:
  workflow_dispatch:
    inputs:
      n_dates:
        description: '評価時点数'
        default: '40'
      history_days:
        description: '取得する暦日数(既定1825=5年)'
        default: '1825'
      universe_cap:
        description: '銘柄数の上限。空欄なら全銘柄(初回は動作確認に200程度を推奨)'
        default: ''

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Japanese font (Noto Sans CJK)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk

      - name: Run backtest
        run: |
          set -o pipefail
          ARGS="--n-dates ${{ github.event.inputs.n_dates }} --history-days ${{ github.event.inputs.history_days }}"
          if [ -n "${{ github.event.inputs.universe_cap }}" ]; then
            ARGS="$ARGS --universe-cap ${{ github.event.inputs.universe_cap }}"
          fi
          python backtest.py $ARGS | tee out_v7/backtest_log.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: |
            out_v7/backtest_report.txt
            out_v7/backtest_panel.csv
            out_v7/backtest_result.png
            out_v7/backtest_log.txt
          if-no-files-found: warn
