name: data-daily

# 平日 7:00 JST に 取得 → 整合性検査 → 保存 → 日次スナップショット → ユニバース
# → 19条件のスクリーニングと配信記録（docs/SCREENER.md §2・§3.2）
# → 配信記録の結果付け（§3.3）→ LINE 配信（§4）。
# 配信はテキスト（Cloudflare Worker 経由）。画像カードの描画は未実装。

on:
  schedule:
    - cron: "0 22 * * 0-4"    # 7:00 JST 月〜金
  workflow_dispatch:
    inputs:
      fetch_scope:
        description: "all | universe | auto"
        default: "auto"
      dryrun:
        description: "1 で合成データ"
        default: "0"

permissions:
  contents: write

concurrency:
  group: data-daily
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # 保存データ(store)は git にコミットしない。Actions cache で日をまたいで引き継ぐ。
      - name: Restore store
        uses: actions/cache@v4
        with:
          path: data/store
          key: store-v2-${{ github.run_id }}
          restore-keys: |
            store-v2-

      - name: Tests
        run: python -m unittest discover -s tests -t .

      - name: Daily data
        env:
          SCREEN_DRYRUN: ${{ github.event.inputs.dryrun || '0' }}
          FETCH_SCOPE: ${{ github.event.inputs.fetch_scope || 'auto' }}
          FETCH_DEADLINE_SEC: "5400"
          HISTORY_DAYS: "400"
          MIN_ADV_JPY: "200000000"
          MIN_PRICE: "200"
          MIN_HISTORY_BARS: "250"
        run: python -m stockbot.cli daily

      # 決算発表予定日・上場廃止銘柄一覧の更新（T-104）。取得失敗時も例外を投げず
      # 既存ファイルを維持するだけなので、ここが失敗して daily 側の成果を失う心配はない。
      - name: References data
        env:
          SCREEN_DRYRUN: ${{ github.event.inputs.dryrun || '0' }}
        run: python -m stockbot.cli references

      # 19条件で候補を選び、配信記録に保存する（docs/SCREENER.md §2）。
      # references（決算発表予定日）の後に置く —— A4 の判定に使うため。
      - name: Screen
        env:
          SCREEN_DRYRUN: ${{ github.event.inputs.dryrun || '0' }}
        run: python -m stockbot.cli screen

      # 配信記録に5営業日後の結果を付ける（docs/SCREENER.md §3.3）。references と同じく
      # daily とは別ステップにして、ここが失敗しても取得・保存の成果を失わないようにする。
      - name: Resolve delivered records
        env:
          SCREEN_DRYRUN: ${{ github.event.inputs.dryrun || '0' }}
        run: python -m stockbot.cli resolve

      - name: Commit snapshots
        if: always()
        run: |
          git config user.name "stockbot"
          git config user.email "stockbot@users.noreply.github.com"
          git add data/daily data/universe data/reference 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          if ! git push; then
            git pull --rebase && git push
          fi

      # LINE 配信（docs/SCREENER.md §4）。**コミットより後ろに置く。**
      # 配信が失敗しても screen と resolve の結果は既に main に push 済みで失われない。
      # continue-on-error にはしない（失敗を握り潰すと配信されない原因が分からなくなる）。
      - name: Notify (LINE)
        if: always()
        env:
          SCREEN_DRYRUN: ${{ github.event.inputs.dryrun || '0' }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
        run: python -m stockbot.cli notify

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_id }}
          path: |
            data/store/fetch_meta.json
            data/store/revisions.csv.gz
            data/store/split_issues.csv
            data/universe/summary.json
          if-no-files-found: ignore
