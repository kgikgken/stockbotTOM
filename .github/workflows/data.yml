name: data-daily

# 平日 7:00 JST に 取得 → 整合性検査 → 保存 → 日次スナップショット → ユニバース
# → 既存の配信記録の結果付け（docs/SCREENER.md §3.3）。
#
# **19条件のスクリーニングと LINE 配信は 2026-09-08 に停止した**
# （docs/SCREENER_CLOSING.md）。候補が出ないので空の配信を送らない。
# 取得・保存・ユニバースと、既に配信済み15件の結果付けだけを続ける。

on:
  schedule:
    - cron: "0 22 * * 0-4"    # 7:00 JST 月〜金
  workflow_dispatch:
    inputs:
      fetch_scope:
        description: "all | universe | auto"
        default: "auto"
      dryrun:
        description: "1 で合成データ"
        default: "0"

permissions:
  contents: write

concurrency:
  group: data-daily
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # 画像カードの描画（docs/SCREENER.md §4.5）。配信は停止中だが描画コードは
      # 維持しているので、環境ごと壊れないよう導入は続ける（continue-on-error）。
      - name: Install Chromium and CJK fonts (for image cards)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m playwright install --with-deps chromium

      # 保存データ(store)は git にコミットしない。Actions cache で日をまたいで引き継ぐ。
      - name: Restore store
        uses: actions/cache@v4
        with:
          path: data/store
          key: store-v2-${{ github.run_id }}
          restore-keys: |
            store-v2-

      - name: Tests
        run: python -m unittest discover -s tests -t .

      - name: Daily data
        env:
          SCREEN_DRYRUN: ${{ github.event.inputs.dryrun || '0' }}
          FETCH_SCOPE: ${{ github.event.inputs.fetch_scope || 'auto' }}
          FETCH_DEADLINE_SEC: "5400"
          HISTORY_DAYS: "400"
          MIN_ADV_JPY: "200000000"
          MIN_PRICE: "200"
          MIN_HISTORY_BARS: "250"
        run: python -m stockbot.cli daily

      # 決算発表予定日・上場廃止銘柄一覧の更新（T-104）。取得失敗時も例外を投げず
      # 既存ファイルを維持するだけなので、ここが失敗して daily 側の成果を失う心配はない。
      - name: References data
        env:
          SCREEN_DRYRUN: ${{ github.event.inputs.dryrun || '0' }}
        run: python -m stockbot.cli references

      # 反転系パターンの検出数を数える（docs/PATTERN.md §2.1）。
      # **数えてログに出すだけ。何も保存しないし配信もしない。**
      # 事前登録した数値どおりに実装できているかを実データで確かめるためのもので、
      # 最初の観測が済んだら外してよい。continue-on-error にはしない（落ちたら気づく）。
      - name: Detect patterns (report only)
        env:
          SCREEN_DRYRUN: ${{ github.event.inputs.dryrun || '0' }}
        run: python -m stockbot.cli pattern

      # 配信記録に5営業日後の結果を付ける（docs/SCREENER.md §3.3）。references と同じく
      # daily とは別ステップにして、ここが失敗しても取得・保存の成果を失わないようにする。
      - name: Resolve delivered records
        env:
          SCREEN_DRYRUN: ${{ github.event.inputs.dryrun || '0' }}
        run: python -m stockbot.cli resolve

      - name: Commit snapshots
        if: always()
        run: |
          git config user.name "stockbot"
          git config user.email "stockbot@users.noreply.github.com"
          git add data/daily data/universe data/reference 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          if ! git push; then
            git pull --rebase && git push
          fi

      # LINE 配信は停止中（2026-09-08）。19 条件のスクリーナーを外して候補が
      # 出なくなったので、空の配信を送らないためにステップごと外してある
      # （docs/SCREENER_CLOSING.md）。**配信経路そのものは消していない** ——
      # worker.js・Secrets・notify コマンド・画像カードの描画はすべて残っており、
      # パターン実装が入ったらこのステップを戻すだけで再開できる。
      # なお `cli notify` は「今日の配信日の要約」が無いと何も送らないので、
      # 手で叩いても古い候補が流れることはない。

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_id }}
          path: |
            data/store/fetch_meta.json
            data/store/revisions.csv.gz
            data/store/split_issues.csv
            data/universe/summary.json
          if-no-files-found: ignore
