name: analyze

# 既存の backtest_result.csv を分析するだけ。データ取得をしないので数秒で終わる。
# backtest.yml(2時間)とは別に、何度でも気軽に回せる。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Analyze
        run: |
          python analyze_backtest.py out_topdown/backtest_result.csv \
            2>&1 | tee out_topdown/analysis_report.txt

      - name: Persist result
        if: always()
        run: |
          git config user.name "stockbot"
          git config user.email "stockbot@users.noreply.github.com"
          [ -f out_topdown/analysis_report.txt ] && git add out_topdown/analysis_report.txt || true
          git diff --cached --quiet || git commit -m "analysis: $(date -u +%F)"
          git push || echo "push skipped"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis
          path: out_topdown/analysis_report.txt
          if-no-files-found: warn
