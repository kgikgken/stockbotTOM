name: v6-screen

# stockbotTOM v6.0 — 7人の手法による直列フィルター。
# v5(screen.yml)とは独立して動く。並行運用して比較できるようにしてある。

on:
  schedule:
    - cron: "0 22 * * 0-4"    # 7:00 JST 月〜金
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v6:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ★2026-08 追加: PNGレポートの日本語文字が「豆腐(□)」になる不具合の修正。
      # ubuntu-latestランナーには日本語フォントが入っておらず、report_png.pyが
      # 指定するパス(/usr/share/fonts/opentype/noto/NotoSansCJK-*.ttc)が存在しないと
      # PILがCJK非対応の代替フォントに落ち、日本語だけ文字化けする
      # (英数字・記号は正常に見えるため発見が遅れやすい)。
      - name: Install Japanese font (Noto Sans CJK)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          fc-list | grep -i noto | grep -i cjk || echo "⚠フォントが見つからない場合は下のフォールバックを確認"
          ls -la /usr/share/fonts/opentype/noto/ || true

      - name: Run v6
        env:
          SCREEN_DRYRUN: '0'
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          V6_EQUITY: ${{ vars.V6_EQUITY }}
          V6_PEAK_EQUITY: ${{ vars.V6_PEAK_EQUITY }}
        run: python main_v6.py

      - name: Persist watchlist and report
        if: always()
        run: |
          git config user.name "stockbot"
          git config user.email "stockbot@users.noreply.github.com"
          for f in out_v6/watchlist.csv positions_v6.csv ; do
            [ -f "$f" ] && git add "$f" || echo "skip (not present): $f"
          done
          git diff --cached --quiet || git commit -m "v6: $(date -u +%F)"
          git push || echo "push skipped"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-report
          path: out_v6/
          if-no-files-found: warn
